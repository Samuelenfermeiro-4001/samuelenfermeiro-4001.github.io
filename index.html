<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Samuel Enfermeiro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --navy: #0d1b4c;
    --navy-deep: #060f30;
    --gold: #ffc72c;
    --blue: #0b63f6;
    --ink: #16192b;
    --muted: #6b7280;
    --paper: #eef1f6;
    --card: #ffffff;
    --ring: #e2e6ee;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  .masthead {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 4px 18px 4px;
  }
  .badge {
    width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(150deg, var(--navy), var(--navy-deep));
    display: flex; align-items: center; justify-content: center;
  }
  .badge svg { color: var(--gold); }
  .masthead-name { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; color: var(--navy); line-height: 1.15; }
  .masthead-tag { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 1px; }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 26px;
    overflow: hidden;
    background: var(--card);
    box-shadow: 0 12px 30px rgba(13,27,76,0.22);
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .stage.has-photo canvas { cursor: grab; }
  .stage.dragging canvas { cursor: grabbing; }

  .hint-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .hint {
    position: absolute; left: 50%; top: 39%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .hint-icon {
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    color: #4a5164;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  .hint-text {
    font-size: 12px; font-weight: 700; color: #fff;
    background: rgba(20,24,44,0.6);
    padding: 5px 12px; border-radius: 999px;
  }

  .zoom-row {
    display: flex; align-items: center; gap: 12px;
    margin-top: 16px; background: var(--card);
    border-radius: 16px; padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(13,27,76,0.06);
  }
  .zoom-row svg { color: var(--muted); flex-shrink: 0; }
  .zoom-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 999px; background: var(--ring); outline: none;
  }
  .zoom-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--navy); border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer;
  }
  .zoom-row input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--navy); border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer;
  }
  .zoom-row input:disabled { opacity: 0.5; }

  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 12.5px;
    letter-spacing: 0.3px; color: #fff; background: var(--blue);
    border: none; border-radius: 16px; padding: 15px 10px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-align: center; line-height: 1.2; text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(11,99,246,0.28);
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .btn-row .btn { flex: 1; }
  .btn-full { width: 100%; margin-top: 12px; }
  .download-caption {
    font-size: 11px; color: var(--muted); text-align: center;
    margin-top: 8px; line-height: 1.4;
  }
  .btn-ghost {
    background: var(--card); color: var(--navy);
    border: 1.5px solid var(--ring); box-shadow: 0 2px 8px rgba(13,27,76,0.08);
  }
  .btn-ghost svg { color: var(--navy); }
  .btn-ghost:disabled { background: #f1f3f8; color: #a8b0c2; border-color: transparent; box-shadow: none; }
  .btn-ghost:disabled svg { color: #a8b0c2; }
  .btn-row-alt { margin-top: 10px; }

  .estilos {
    margin-top: 16px; background: var(--card); border-radius: 16px;
    padding: 13px 15px 15px; box-shadow: 0 2px 8px rgba(13,27,76,0.06);
  }
  .estilos-rotulo {
    display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 11px;
  }
  .estilos-opcoes { display: flex; gap: 11px; }
  .estilo {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 12.5px;
    color: var(--navy); background: #fff; border: 2px solid var(--ring);
    border-radius: 14px; padding: 10px 8px 11px; cursor: pointer;
  }
  .estilo img {
    width: 100%; max-width: 108px; height: auto; border-radius: 9px;
    background: #eef1f6; display: block;
  }
  .estilo.ativo { border-color: var(--navy); background: #f2f5fc; }
  .estilo.ativo img { box-shadow: 0 0 0 2px var(--gold); }
  .estilo span { display: block; line-height: 1.25; }
  .estilo small {
    display: block; font-weight: 600; font-size: 10.5px; color: var(--muted);
    margin-top: 2px; letter-spacing: 0;
  }
  .estilo:active { transform: translateY(1px); }

  .ig-card {
    display: flex; align-items: center; gap: 12px;
    margin-top: 18px; padding: 13px 15px;
    background: var(--card); border-radius: 16px;
    box-shadow: 0 2px 8px rgba(13,27,76,0.08);
    text-decoration: none; color: inherit;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .ig-card:active { transform: translateY(1px); }
  .ig-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; color: #fff;
    background: linear-gradient(45deg, #f9ce34 0%, #ee2a7b 50%, #6228d7 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .ig-text { flex: 1; min-width: 0; }
  .ig-handle { font-weight: 800; font-size: 14px; color: var(--navy); }
  .ig-cta { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .ig-chev { color: var(--muted); flex-shrink: 0; }
  .btn:disabled {
    background: #b9c2d6; box-shadow: none; cursor: not-allowed;
  }
  .btn:not(:disabled):active { transform: translateY(1px); }
  input[type="file"] { display: none; }

  .footer {
    text-align: center; margin-top: 22px;
    font-size: 11.5px; color: var(--muted);
  }
  .footer strong { color: var(--navy); }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: #fff; font-size: 13px; font-weight: 700;
    padding: 12px 20px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
</style>
</head>

    m.img.src = m.src + '?v=' + VERSAO;
  });
  function atual() { return MOLDURAS[selecionado]; }
  function molduraStory() { return atual(); }

  // Recorte pelo proprio alfa da moldura: o buraco e exatamente o que a arte
  // deixou vazado, sem oval aproximado. Evita a foto vazar por baixo das ondas.
  function mascaraDe(moldura, W, H) {
    if (moldura.mascara && moldura.mascara.width === W) return moldura.mascara;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    x.drawImage(moldura.img, 0, 0, W, H);
    var dados = x.getImageData(0, 0, W, H);
    var d = dados.data;
    // A foto ocupa exatamente o inverso da moldura, inclusive na borda suave.
    // Corte duro aqui deixaria um vão claro em volta do candidato.
    for (var i = 0; i < d.length; i += 4) {
      var a = d[i + 3];
      d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
      d[i + 3] = 255 - a;
    }
    x.putImageData(dados, 0, 0);
    moldura.mascara = c;
    return c;
  }

  var photo = null;
  var naturalW = 0, naturalH = 0;
  var baseScale = 1;
  var zoom = 1;
  var offsetX = 0, offsetY = 0;
  var autoOffsetY = 0;
  var dragging = false;
  var lastX = 0, lastY = 0;

  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function clampOffsets() {
    var scale = baseScale * zoom;
    var drawW = naturalW * scale, drawH = naturalH * scale;
    var h = molduraStory();
    var maxX = Math.max(0, drawW / 2 - h.rx);
    var maxY = Math.max(0, drawH / 2 - h.ry);
    offsetX = Math.min(maxX, Math.max(-maxX, offsetX));
    offsetY = Math.min(maxY, Math.max(-maxY, offsetY));
  }

  var palco = document.createElement('canvas');
  var pctx = palco.getContext('2d');

  function render() {
    var h = atual();
    if (canvas.width !== h.W || canvas.height !== h.H) {
      canvas.width = h.W; canvas.height = h.H;
      stage.style.aspectRatio = h.W + ' / ' + h.H;
    }
    // O palco precisa acompanhar sempre, e nao so quando o canvas muda de
    // tamanho: na abertura os dois ja coincidem e ele ficaria em 300x150.
    if (palco.width !== h.W || palco.height !== h.H) {
      palco.width = h.W; palco.height = h.H;
    }
    ctx.clearRect(0, 0, h.W, h.H);

    pctx.clearRect(0, 0, h.W, h.H);
    pctx.fillStyle = '#ffffff';
    pctx.fillRect(0, 0, h.W, h.H);
    if (photo) {
      var scale = baseScale * zoom;
      var drawW = naturalW * scale, drawH = naturalH * scale;
      pctx.drawImage(photo, h.focoX + offsetX - drawW / 2, h.cy + offsetY - drawH / 2, drawW, drawH);
    }
    if (h.pronta) {
      pctx.globalCompositeOperation = 'destination-in';
      pctx.drawImage(mascaraDe(h, h.W, h.H), 0, 0);
      pctx.globalCompositeOperation = 'source-over';
    }
    ctx.drawImage(palco, 0, 0);
    if (h.pronta) ctx.drawImage(h.img, 0, 0, h.W, h.H);
  }

  // Troca de moldura: recalcula o enquadramento para o buraco novo.
  function selecionar(i) {
    if (i === selecionado) return;
    selecionado = i;
    var h = atual();
    if (photo) {
      baseScale = Math.max((h.rx * 2) / naturalW, (h.ry * 2) / naturalH);
      offsetY = naturalH * 0.10 * baseScale;
      autoOffsetY = offsetY;
      offsetX = 0;
      zoom = Number(zoomInput.value) / 100;
      clampOffsets();
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-moldura]'), function (b) {
      var ativo = Number(b.getAttribute('data-moldura')) === i;
      b.classList.toggle('ativo', ativo);
      b.setAttribute('aria-checked', ativo ? 'true' : 'false');
    });
    render();
    showToast(h.nome);
  }


  function loadPhoto(file) {
    var url = URL.createObjectURL(file);
    var image = new Image();
    image.onload = function () {
      photo = image;
      naturalW = image.naturalWidth;
      naturalH = image.naturalHeight;
      var h0 = molduraStory();
      baseScale = Math.max((h0.rx * 2) / naturalW, (h0.ry * 2) / naturalH);
      zoom = 1;
      offsetX = 0;
      // Enquadramento inicial mirando um pouco acima do centro: em retrato o rosto
      // fica no terco superior, e centralizar corta o alto da cabeca.
      offsetY = naturalH * 0.10 * baseScale;
      clampOffsets();
      autoOffsetY = offsetY;
      zoomInput.disabled = false;
      zoomInput.value = 110;
      zoom = 1.10;
      hintOverlay.style.display = 'none';
      stage.classList.add('has-photo');
      downloadBtn.disabled = false;
      shareBtn.disabled = false;
      photoBtnLabel.textContent = 'Trocar foto';
      render();
      URL.revokeObjectURL(url);
    };
    image.onerror = function () {
      showToast('Não foi possível abrir essa foto.');
      URL.revokeObjectURL(url);
    };
    image.src = url;
  }

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) loadPhoto(file);
    fileInput.value = '';
  });

  zoomInput.addEventListener('input', function () {
    zoom = Number(zoomInput.value) / 100;
    clampOffsets();
    render();
  });

  function canvasScale() {
    var rect = canvas.getBoundingClientRect();
    var h = atual();
    return { x: h.W / rect.width, y: h.H / rect.height };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (!photo) return;
    dragging = true;
    stage.classList.add('dragging');
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var s = canvasScale();
    offsetX += (e.clientX - lastX) * s.x;
    offsetY += (e.clientY - lastY) * s.y;
    lastX = e.clientX;
    lastY = e.clientY;
    clampOffsets();
    render();
  });
  function endDrag() { dragging = false; stage.classList.remove('dragging'); }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', function () { if (dragging) endDrag(); });

  function outputFilename() { return 'samuel-enfermeiro-vote-4001.png'; }

  function browserSave(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    return Promise.resolve();
  }

  function saveBlob(blob, filename) {
    if (window.claude && typeof window.claude.use === 'function') {
      return window.claude.use('downloads').then(function (downloads) {
        if (!downloads) return browserSave(blob, filename);
        return downloads.save({ filename: filename, data: blob }).catch(function (err) {
          if (err && err.code === 'declined') return;
          return browserSave(blob, filename);
        });
      }).catch(function () { return browserSave(blob, filename); });
    }
    return browserSave(blob, filename);
  }

  function canvasToBlob(c) {
    return new Promise(function (resolve) { c.toBlob(function (blob) { resolve(blob); }, 'image/png'); });
  }

  // Formato quadrado 1:1 (feed e foto de perfil): a moldura circular por cima,
  // a foto por baixo aparecendo pelo miolo vazado. Recortar a foto no circulo
  // externo evita que ela vaze nos cantos, onde a moldura e transparente.
  // Gera o arquivo da moldura selecionada, com o mesmo encaixe do quadro.
  function desenharAtual() {
    var h = atual();
    var c = document.createElement('canvas');
    c.width = h.W; c.height = h.H;
    var g = c.getContext('2d');
    render();
    g.drawImage(canvas, 0, 0);
    return c;
  }

  // Um arquivo por toque: navegador de celular costuma bloquear downloads em sequência.
  function baixar(botao) {
    if (!photo) return;
    var h = atual();
    botao.disabled = true;
    canvasToBlob(desenharAtual()).then(function (blob) {
      if (!blob) return;
      return saveBlob(blob, h.arquivo).then(function () { showToast('Foto baixada!'); });
    }).catch(function () {
      showToast('Não foi possível baixar. Tente de novo.');
    }).then(function () {
      botao.disabled = false;
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-moldura]'), function (b) {
    b.addEventListener('click', function () { selecionar(Number(b.getAttribute('data-moldura'))); });
  });

  // arrastar para o lado percorre as molduras, quando nao ha foto para reposicionar
  var toqueX = null, toqueY = null;
  canvas.addEventListener('pointerdown', function (e) { toqueX = e.clientX; toqueY = e.clientY; });
  canvas.addEventListener('pointerup', function (e) {
    if (toqueX === null) return;
    var dx = e.clientX - toqueX, dy = e.clientY - toqueY;
    toqueX = null;
    if (!photo && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      var i = selecionado + (dx < 0 ? 1 : -1);
      selecionar((i + MOLDURAS.length) % MOLDURAS.length);
    }
  });

  downloadBtn.addEventListener('click', function () { baixar(downloadBtn); });

  shareBtn.addEventListener('click', function () {
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var filename = outputFilename();
      if (navigator.canShare) {
        var file = new File([blob], filename, { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({
            files: [file],
            title: 'Eu apoio Samuel Enfermeiro',
            text: 'Vote 4001 - Samuel Enfermeiro para Deputado Federal'
          }).catch(function (err) {
            if (err && err.name === 'AbortError') return;
            saveBlob(blob, filename);
          });
          return;
        }
      }
      saveBlob(blob, filename);
    }, 'image/png');
  });

  campaignBtn.addEventListener('click', function () {
    var shareData = {
      title: 'Eu apoio Samuel Enfermeiro',
      text: 'Vote 4001 - Samuel Enfermeiro para Deputado Federal.',
      url: location.href
    };
    if (navigator.share) {
      navigator.share(shareData).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        copyLink();
      });
    } else {
      copyLink();
    }
  });

  function copyLink() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(function () {
        showToast('Link copiado!');
      }).catch(function () {
        showToast('Não foi possível copiar o link.');
      });
    } else {
      showToast('Não foi possível copiar o link.');
    }
  }

  render();
})();
</script>
</body>
</html>
